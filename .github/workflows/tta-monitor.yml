name: 沖縄県卓球協会HP 更新監視

on:
  schedule:
    - cron: "13 3 * * *"   # 毎日 12:13 JST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: tta-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_BRANCH: tta-monitor-data
    steps:
      - uses: actions/checkout@v4

      - name: 前回スナップショットを取得
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add state "origin/$DATA_BRANCH"
          else
            mkdir state
          fi

      - name: サイトを取得して比較
        env:
          STATE_DIR: state
          # トップ / 大会日程・結果 / 高体連 / 中体連 / 小学生 / 一般・大学
          TTA_PAGES: >-
            https://tta.okinawa/,
            http://www.tta.okinawa/user.php?CMD=115401200000000,
            http://www.tta.okinawa/user.php?CMD=114100000000004,
            http://www.tta.okinawa/user.php?CMD=114100000000005,
            http://www.tta.okinawa/user.php?CMD=114100000000006,
            http://www.tta.okinawa/user.php?CMD=114100000000003
          REPORT_PATH: report.md
        run: python3 .github/scripts/tta_monitor.py

      - name: スナップショットを保存
        working-directory: state
        run: |
          if [ ! -e .git ]; then
            git init -q -b "$DATA_BRANCH"
            git remote add origin "$(git -C .. remote get-url origin)"
            git config http.https://github.com/.extraheader "$(git -C .. config --get http.https://github.com/.extraheader)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "保存内容に変化なし"; exit 0; fi
          git commit -q -m "TTA snapshot $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push origin "HEAD:refs/heads/$DATA_BRANCH"

      - name: 更新があれば Issue で通知
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "【卓球協会HP】更新を検知 $(TZ=Asia/Tokyo date '+%Y-%m-%d')" \
            --body-file report.md
